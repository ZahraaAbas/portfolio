  <main>
    <section class="contact">
      <div>
        <span class="eyebrow">Get in touch</span>
        <h2>Let's <span class="highlight">Connect</span></h2>
        <p>Have a question or want to work together? Fill out the form or reach out directly.</p>

        <div class="contact-info">
          <div class="info-item">
            <div class="info-icon">✉</div>
            <div class="info-text">
              <strong>Email</strong>
              <a href="mailto:zhraaabood27@email.com">zhraaabood27@email.com</a>
            </div>
          </div>
          <div class="info-item">
            <div class="info-icon">📍</div>
            <div class="info-text">
              <strong>Location</strong>
              <span>Baghdad, Iraq</span>
            </div>
          </div>
          <div class="info-item">
            <div class="info-icon">🔗</div>
            <div class="info-text">
              <strong>Social</strong>
              <span>
                <!-- TODO: replace with your own profile links -->
                <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
                <a href="https://www.linkedin.com" target="_blank" rel="noopener">LinkedIn</a>
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- TODO: set action to a form service (e.g. Formspree) so messages are delivered -->
      <form class="contact-form" action="" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@email.com" required>
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Your message..." rows="5" required></textarea>
        <button type="submit" id="btn">Send Message</button>
      </form>
    </section>
